<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1400" height="820" fill="#fff"/>
<text x="700" y="42" text-anchor="middle" font-size="26" font-weight="bold">Architecture - AirHealth Data Space</text>

<rect x="50" y="90" width="520" height="300" rx="16" fill="#e8f3fc" stroke="#2f6db0" stroke-width="3"/>
<text x="310" y="125" text-anchor="middle" font-size="20" font-weight="bold">Organisation A - Environnement</text>
<text x="310" y="152" text-anchor="middle" font-size="16">Nœud A - API FastAPI :8001</text>
<text x="80" y="188" font-size="15">• GET /catalog (catalogue inspiré de DCAT)</text>
<text x="80" y="212" font-size="15">• POST /contracts/negotiate (finalité research)</text>
<text x="80" y="236" font-size="15">• GET /classifications (signées HMAC)</text>
<text x="80" y="260" font-size="15">• GET /features (ML)</text>
<rect x="150" y="295" width="320" height="52" rx="8" fill="#fff" stroke="#2f6db0" stroke-width="2"/>
<text x="310" y="327" text-anchor="middle" font-size="15">SQLite environnement.db (PM2.5)</text>

<rect x="830" y="90" width="520" height="300" rx="16" fill="#fcefe6" stroke="#c0552b" stroke-width="3"/>
<text x="1090" y="125" text-anchor="middle" font-size="20" font-weight="bold">Organisation B - Hôpital</text>
<text x="1090" y="152" text-anchor="middle" font-size="16">Nœud B v2 - API FastAPI :8002</text>
<text x="860" y="188" font-size="15">• POST /compute (clé API + signature HMAC)</text>
<text x="860" y="212" font-size="15">• seuil minimal 3 jours + bruit de Laplace imposé</text>
<text x="860" y="236" font-size="15">• budget ε par (consommateur, dataset)</text>
<text x="860" y="260" font-size="15">• GET /audit, /budget, POST /train</text>
<rect x="850" y="295" width="230" height="52" rx="8" fill="#fff" stroke="#c0552b" stroke-width="2"/>
<text x="965" y="327" text-anchor="middle" font-size="15">hopital.db (admissions)</text>
<rect x="1100" y="295" width="230" height="52" rx="8" fill="#fff" stroke="#c0552b" stroke-width="2"/>
<text x="1215" y="327" text-anchor="middle" font-size="15">gouvernance_b.db (ε, audit)</text>

<line x1="570" y1="240" x2="830" y2="240" stroke="#888" stroke-width="2" stroke-dasharray="8,6"/>
<text x="700" y="222" text-anchor="middle" font-size="14" fill="#555">secret HMAC partagé A ↔ B</text>
<text x="700" y="262" text-anchor="middle" font-size="14" fill="#555">(le laboratoire ne le connaît pas)</text>

<rect x="440" y="520" width="520" height="210" rx="16" fill="#eaf5ee" stroke="#2e8b57" stroke-width="3"/>
<text x="700" y="555" text-anchor="middle" font-size="20" font-weight="bold">Organisation C - Laboratoire</text>
<text x="700" y="582" text-anchor="middle" font-size="16">Nœud C - orchestrateur FastAPI :8000 + dashboard</text>
<text x="700" y="620" text-anchor="middle" font-size="15">Les clés API restent côté serveur</text>
<text x="700" y="645" text-anchor="middle" font-size="15">Ne lit jamais les fichiers SQLite</text>
<text x="700" y="670" text-anchor="middle" font-size="15">Ne reçoit que : catalogue, classifications, agrégats bruités</text>

<rect x="560" y="765" width="280" height="40" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="700" y="791" text-anchor="middle" font-size="15">Navigateur (http://127.0.0.1:8000)</text>
<line x1="700" y1="765" x2="700" y2="732" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<line x1="500" y1="520" x2="340" y2="395" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<text x="250" y="450" font-size="14">1-4 catalogue, contrat,</text>
<text x="250" y="470" font-size="14">classifications signées</text>
<line x1="900" y1="520" x2="1060" y2="395" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1020" y="450" font-size="14">5 paquet signé</text>
<text x="1020" y="470" font-size="14">→ agrégats uniquement</text>

<text x="700" y="68" text-anchor="middle" font-size="15" fill="#555">Les données brutes restent chez leur propriétaire ; seuls classifications et agrégats circulent.</text>
</svg>
